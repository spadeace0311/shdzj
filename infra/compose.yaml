services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      SUPERADMIN_INITIAL_PASSWORD: "${SUPERADMIN_INITIAL_PASSWORD:?SUPERADMIN_INITIAL_PASSWORD is required}"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
      - ../config:/config
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      CENC_COLLECTOR_ENABLED: "true"
      FAN_API_KEY: "${FAN_API_KEY:-}"
      FAN_APP_ID: "${FAN_APP_ID:-}"
      CENC_APP_ID: "${CENC_APP_ID:-}"
      COLLECTOR_SPOOL_DIR: "/var/lib/collector-spool"
    command: ["python", "-m", "app.collector.main"]
    volumes:
      - ../backend:/app
      - ../config:/config
      - collector-spool:/var/lib/collector-spool
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
  collector-spool:
