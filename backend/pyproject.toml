[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sh-earthquake-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "fastapi==0.115.6",
  "geoalchemy2==0.16.0",
  "httpx==0.28.1",
  "numpy==2.2.2",
  "pyjwt==2.10.1",
  "pyodbc==5.2.0",
  "pwdlib[argon2]==0.2.1",
  "pydantic-settings==2.7.0",
  "pyproj==3.7.1",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "rasterio==1.4.3",
  "shapely==2.0.6",
  "sqlalchemy[asyncio]==2.0.36",
  "temporalio==1.33.0",
  "uvicorn[standard]==0.34.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.8.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "performance: integration benchmarks that use the full configured grid",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
